<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ESCAPEMENT · a watchmaker's bench in the browser</title>
    <meta
      name="description"
      content="ESCAPEMENT is a silent watchmaker's bench: assemble a movement, wind the mainspring, turn the regulator, diagnose five faults, and earn a bench certificate. Deterministic horology, SVG movement, no account, no network."
    />
    <meta name="theme-color" content="#f1e7d2" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://escapement-two.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://escapement-two.vercel.app/" />
    <meta property="og:site_name" content="ESCAPEMENT" />
    <meta property="og:title" content="ESCAPEMENT · a watchmaker's bench" />
    <meta
      property="og:description"
      content="Assemble, wind, regulate, diagnose, and certify a mechanical movement. A deterministic watchmaker's bench in the browser."
    />
    <meta property="og:image" content="https://escapement-two.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://escapement-two.vercel.app/og.png" />
    <script>
      try {
        var theme = localStorage.getItem('escapement.theme');
        if (theme === 'night') {
          document.documentElement.dataset.theme = 'night';
          var themeMeta = document.querySelector('meta[name="theme-color"]');
          if (themeMeta) themeMeta.setAttribute('content', '#1b1410');
        }
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
